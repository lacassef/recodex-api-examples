    svg {
      background-image: url("soccer_field.png");
      background-repeat: no-repeat;
      background-color: #228B22;
      width: 297px;
      height: 186px;
    }
    .node {
      fill: #c0cd32;
      opacity: 0.5;
    }
  </style>

    <label>Radius scale: <input id="radiusScale" type="range" min="2" max="12" value="5"></label>
    <label style="margin-left:12px;">Opacity: <input id="opacityScale" type="range" min="0.2" max="1" step="0.1" value="0.5"></label>
    <span id="heatmapStatus" style="margin-left:8px; font-size:12px; color:#555;"></span>
  </div>
  <svg></svg>

    // response bodies: {heatmap}, {playerPoints, goalkeeperPoints}, and
    // {points:[{x, y, count}], matches, events}. x and y are 0-100 on the full pitch.

    function pointsFromPayload(body) {
      if (Array.isArray(body)) return body;
      if (!body || typeof body !== "object") return [];
      if (Array.isArray(body.heatmap)) return body.heatmap;
      if (Array.isArray(body.points)) return body.points;
      var out = [];
      if (Array.isArray(body.playerPoints)) out = out.concat(body.playerPoints);
      if (Array.isArray(body.goalkeeperPoints)) out = out.concat(body.goalkeeperPoints);
      return out;
    }

    function aggregate(points) {
      var byKey = new Map();
      var out = [];
      for (var i = 0; i < points.length; i++) {
        var p = points[i];
        var n = (typeof p.count === "number" && p.count > 0) ? p.count : 1;
        var key = p.x + "," + p.y;
        var existing = byKey.get(key);
        if (!existing) {
          existing = {x: p.x, y: p.y, count: 0};
          byKey.set(key, existing);
          out.push(existing);
        }
        existing.count += n;
      }
      return out;
    }

    var convertedData = aggregate(pointsFromPayload(data));
    
    // Append the circles to the SVG with dynamic controls
    var svg = d3.select("svg");
    var radiusInput = document.getElementById('radiusScale');
    var opacityInput = document.getElementById('opacityScale');

    // initial draw
    var nodes = svg.selectAll(".node")
      .data(convertedData)
      .enter().append("circle")
      .attr("class", "node")
      .attr("cx", function(d) { return d.x / 100 * 297; })
      .attr("cy", function(d) { return 186 - d.y / 100 * 186; });

    function renderHeatmap() {
      var rScale = parseFloat(radiusInput?.value || 5);
      var baseOpacity = parseFloat(opacityInput?.value || 0.5);
      nodes
        .attr("r", function(d) { return d.count * rScale; })
        .style("opacity", function(d) { return Math.max(0.1, baseOpacity - d.count / 20); });
    }

    radiusInput?.addEventListener('input', renderHeatmap);
    opacityInput?.addEventListener('input', renderHeatmap);

    renderHeatmap();
  </script>
