    get:
      tags:
        - Tournaments
      operationId: getCategoryUniqueTournamentEventCount
      summary: Get category unique tournament event count
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: day
          in: path
          required: true
          schema:
            type: string
        - name: month
          in: path
          required: true
          schema:
            type: string
        - name: year
          in: path
          required: true
          schema:
            type: string
        - name: timezoneOffset
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
          description: Internal server error.
          content:
            application/json:
