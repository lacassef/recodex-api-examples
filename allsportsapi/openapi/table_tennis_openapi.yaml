  "/api/search/suggestions/{entityType}":
    get:
      tags:
        - Search
      operationId: getSearchSuggestions
      summary: Get search suggestions
      description: Returns suggestions for one entity type. The All tab uses the path segment default. The request sends sport when it is limited to one sport.
      parameters:
        - name: entityType
          in: path
          required: true
          description: Entity type. The All tab uses default.
          schema:
            type: string
            enum:
              - default
              - teams
              - player-team-persons
              - events
              - unique-tournaments
              - news
              - managers
              - referees
              - venues
        - name: sport
          in: query
          required: false
          description: Sport slug. Omitted when the suggestion is not limited to one sport.
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
          description: Internal server error.
