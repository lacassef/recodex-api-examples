  "/api/rankings/unique-tournament/{tournamentId}/{weightClass}/{gender}":
    get:
      tags:
        - Rankings
      operationId: getDivisionRankings
      summary: Get division rankings
      description: "Returns the ranking rows for one weight class and gender. The MMA event page sends the unique tournament id, the weight class, and the gender. Each value is one path segment and is forwarded unchanged."
      parameters:
        - name: tournamentId
          in: path
          required: true
          description: Unique tournament id.
          schema:
            type: integer
        - name: weightClass
          in: path
          required: true
          description: "Weight class. Example: Heavyweight."
          schema:
            type: string
          example: Heavyweight
        - name: gender
          in: path
          required: true
          description: "Gender segment. Example: M."
          schema:
            type: string
          example: M
      responses:
        "200":
          description: A JSON object with the ranking rows.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
