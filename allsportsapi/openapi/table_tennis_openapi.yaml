    get:
      tags:
        - Media
      operationId: getCountryFlag
      summary: Get country flag
      description: Fetches the PNG flag image asset corresponding to a provided country code. The response is the raw image data. Codes are normalized to uppercase (e.g. jp → JP).
      parameters:
        - name: flag
          in: path
          required: true
          description: "Country code or identifier. Example: 'JP' (or 'jp')."
          schema:
            type: string
      responses:
        "200":
          description: "The country's flag image file."
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Flag with the specified code not found.
          content:
            image/png:
