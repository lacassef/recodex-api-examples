  /api/search/unique-tournaments:
    get:
      tags:
        - Search
      operationId: searchUniqueTournaments
      summary: Search unique tournaments
      description: "Queries /search/unique-tournaments. q is the search text. page is 0-based, and the first page omits page. sport limits the search to one sport."
      parameters:
        - name: q
          in: query
          required: false
          description: Search text.
          schema:
            type: string
        - name: sport
          in: query
          required: false
          description: Sport slug. Omitted when the search is not limited to one sport.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: "Page number. The first page is 0, and that page omits page."
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
