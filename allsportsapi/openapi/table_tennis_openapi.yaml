      operationId: countEventsForATimezoneOffset
      summary: Count events for a timezone offset
      description: "Returns the number of events on the local day for a timezone offset in seconds east of UTC. The offset is not a sport slug. Send the viewer's offset, for example 7200."
      parameters:
        - name: timezoneOffset
          in: path
          required: true
          description: "Seconds east of UTC. Example: 0."
          schema:
            type: integer
          example: 0
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
