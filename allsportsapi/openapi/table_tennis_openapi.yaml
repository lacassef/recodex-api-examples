openapi: 3.0.0
info:
  title: Table Tennis API
  version: "1.0.0"
  description: Table Tennis API routes and the shared AllSports routes. OpenAPI specification.
  x-category: Sports
  x-long-description: Table Tennis API routes and the shared AllSports routes. OpenAPI specification. Status 204 means the route exists and there is no data for those parameters.
  x-version-lifecycle: active
servers:
  - url: https://allsportsapi2.p.rapidapi.com
    description: RapidAPI. Send this host in X-RapidAPI-Host.
tags:
  - name: Calendar
  - name: Categories
  - name: Config
  - name: Managers
  - name: Matches
  - name: Media
  - name: Odds
  - name: Placeholders
  - name: Players
  - name: Rankings
  - name: Search
  - name: TV
  - name: Teams
  - name: Tournaments
  - name: Transfers
paths:
  "/api/calendar/season/{seasonId}/{year}/days-with-events":
    get:
      tags:
        - Calendar
      operationId: getCalendarDaysWithEvents
      summary: Get calendar days with events
      description: Retrieves days that have events for a specific season and year.
      parameters:
        - name: seasonId
          in: path
          required: true
          description: "Season identifier. Example: 61643."
          schema:
            type: integer
          example: 61643
        - name: year
          in: path
          required: true
          description: "Calendar year. Example: 2026."
          schema:
            type: integer
          example: 2026
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "204":
          description: "No content. The requested route exists but there is no data available for the given parameters (e.g. match has no TV coverage, no statistics yet, empty search results, etc.)."
  "/api/category/{categoryId}/image":
    get:
      tags:
        - Categories
      operationId: getCategoryImage
      summary: Get category image
      description: Retrieves the image/logo for a sport category.
      parameters:
        - name: categoryId
          in: path
          required: true
          description: "Sport category identifier. Example: 1."
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "204":
          description: "No content. The requested route exists but there is no data available for the given parameters (e.g. match has no TV coverage, no statistics yet, empty search results, etc.)."
