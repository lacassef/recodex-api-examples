  /api/search/all:
    get:
      tags:
        - Search
      operationId: searchAllEntities
      summary: Search all entities
      description: Queries /search/all. q is the search text. page is 0-based and the results request always sends it. sport limits the search to one sport.
      parameters:
        - name: q
          in: query
          required: false
          description: Search text.
          schema:
            type: string
        - name: sport
          in: query
          required: false
          description: Sport slug. Omitted when the search is not limited to one sport.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number. The first page is 0.
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "204":
