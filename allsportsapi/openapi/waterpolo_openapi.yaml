      parameters:
        - name: entityType
          in: path
          required: true
          description: Entity type.
          schema:
            type: string
            enum:
              - all
              - teams
              - player-team-persons
              - events
              - unique-tournaments
              - news
              - managers
              - referees
              - venues
        - name: q
          in: query
          required: false
          description: Search text.
          schema:
            type: string
        - name: sport
          in: query
          required: false
          description: Sport slug. Omitted when the search is not limited to one sport.
          schema:
            type: string
        - name: page
          in: query
          required: false
