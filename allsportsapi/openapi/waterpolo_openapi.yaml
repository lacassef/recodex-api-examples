      summary: List odds providers for a country
      description: "Returns odds providers for a country and a provider group. type is web, web-featured, or web-odds."
      parameters:
        - name: countryCode
          in: path
          required: true
          description: "Country code. Example: MZ."
          schema:
            type: string
