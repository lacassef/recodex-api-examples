  "/api/rankings/unique-tournament/{tournamentId}/{weightClass}/{gender}":
    get:
      operationId: getDivisionRankings
      summary: Get division rankings
      description: "Returns the ranking rows for one weight class and gender. The MMA event page sends the unique tournament id, the weight class, and the gender. Each value is one path segment and is forwarded unchanged."
      parameters:
        - name: tournamentId
          in: path
          required: true
          description: Unique tournament id.
          schema:
            type: integer
        - name: weightClass
          in: path
          required: true
          description: "Weight class. Example: Heavyweight."
          schema:
            type: string
          example: Heavyweight
        - name: gender
          in: path
          required: true
          description: "Gender segment. Example: M."
          schema:
            type: string
          example: M
      responses:
        "200":
          description: A JSON object with the ranking rows.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "204":
          description: "No content. The requested route exists but there is no data available for the given parameters (e.g. match has no TV coverage, no statistics yet, empty search results, etc.)."
  /api/search/all:
    get:
      operationId: searchAllEntities
      summary: Search all entities
      description: Queries /search/all. q is the search text. page is 0-based and the results request always sends it. sport limits the search to one sport.
      parameters:
        - name: q
          in: query
          required: false
          description: Search text.
          schema:
            type: string
        - name: sport
          in: query
          required: false
          description: Sport slug. Omitted when the search is not limited to one sport.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number. The first page is 0.
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "204":
          description: "No content. The requested route exists but there is no data available for the given parameters (e.g. match has no TV coverage, no statistics yet, empty search results, etc.)."
  "/api/search/suggestions/{entityType}":
    get:
      operationId: getSearchSuggestions
      summary: Get search suggestions
      description: Returns suggestions for one entity type. The All tab uses the path segment default. The request sends sport when it is limited to one sport.
      parameters:
        - name: entityType
          in: path
          required: true
          description: Entity type. The All tab uses default.
          schema:
            type: string
            enum:
              - default
              - teams
              - player-team-persons
              - events
              - unique-tournaments
              - news
              - managers
              - referees
              - venues
        - name: sport
          in: query
          required: false
          description: Sport slug. Omitted when the suggestion is not limited to one sport.
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "204":
          description: "No content. The requested route exists but there is no data available for the given parameters (e.g. match has no TV coverage, no statistics yet, empty search results, etc.)."
  /api/search/unique-tournaments:
    get:
      operationId: searchUniqueTournaments
      summary: Search unique tournaments
      description: "Queries /search/unique-tournaments. q is the search text. page is 0-based, and the first page omits page. sport limits the search to one sport."
      parameters:
        - name: q
          in: query
          required: false
          description: Search text.
          schema:
            type: string
        - name: sport
          in: query
          required: false
          description: Sport slug. Omitted when the search is not limited to one sport.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: "Page number. The first page is 0, and that page omits page."
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
