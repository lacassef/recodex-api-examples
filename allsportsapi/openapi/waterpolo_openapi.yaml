  "/api/rankings/team/{teamId}":
    get:
      operationId: getTeamRankings
      summary: Get team rankings
      description: Retrieves rankings for a specific team.
      parameters:
        - name: teamId
          in: path
          required: true
          description: "Unique team identifier. Example: 2817."
          schema:
            type: integer
          example: 2817
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
