  "/api/odds/season/{seasonId}/provider/{providerId}/all":
    get:
      operationId: getAllOddsForASeason
      summary: Get all odds for a season
      description: Returns every odds market for a season and provider. The path has no sport slug.
      parameters:
        - name: seasonId
          in: path
          required: true
          description: Season id.
          schema:
            type: integer
        - name: providerId
          in: path
          required: true
          description: Odds provider id.
          schema:
            type: integer
      responses:
        "200":
