  /api/transfer:
    get:
      operationId: listTransfers
      summary: List transfers
      description: Returns the transfer list. A typical call uses page=1 and sort=-transferFee.
      parameters:
        - name: page
          in: query
          required: false
          description: "Page number, forwarded unchanged. Example: 1."
          schema:
            type: integer
          example: 1
        - name: sort
          in: query
          required: false
          description: "Sort key, forwarded unchanged. Example: -transferFee."
          schema:
            type: string
          example: "-transferFee"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
