  "/api/country/{code}/flag":
    get:
      operationId: getCountryFlagImgAPI
      summary: Get country flag (img API)
      description: Fetches the flag image by country code.
      parameters:
        - name: code
          in: path
          required: true
          description: "Country code or identifier. Example: AU"
          schema:
            type: string
          example: AU
      responses:
        "200":
          description: "The country's flag image file."
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Flag with the specified code not found.
          content:
            image/png:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            image/png:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "204":
          description: "No content. The requested route exists but there is no data available for the given parameters (e.g. match has no TV coverage, no statistics yet, empty search results, etc.)."
  /api/event/newly-added:
    get:
      operationId: listNewlyAddedEvents
      summary: List newly added events
      description: Returns events recently added.
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
