  "/api/tournament/{tournamentId}/season/{seasonId}/statistics":
    get:
      operationId: getAggregatedPlayerStatistics
      summary: Get aggregated player statistics
      description: "Returns season player statistics for one unique tournament. page is 1-based: page 1 is the first page and sends no offset; from page 2 the upstream offset is (page-1)*limit, so limit is required to move past the first page. The football page sends limit 20. group, accumulation, and minApps are enums. The detailed view omits group and sends fields. order is a statistic name, with a leading minus for descending. filters joins field.operator.value conditions with commas. operator, and the values of position, type, and preferredFoot, are enums. Several values in one in condition are joined with ~."
      parameters:
        - name: tournamentId
          in: path
          required: true
          description: "The unique identifier of the tournament. Example: 17."
          schema:
            type: integer
          example: 17
        - name: seasonId
          in: path
          required: true
          description: "The unique identifier of the season. Example: 61627."
          schema:
            type: integer
          example: 61627
        - name: limit
          in: query
          required: false
          description: "Page size. The football page sends 20. Required for page 2 and later. Example: 20."
          schema:
            type: integer
          example: 20
        - name: page
          in: query
          required: false
          description: "1-based page. Page 1 is the first page and does not send offset. Example: 1."
          schema:
            type: integer
          example: 1
        - name: group
          in: query
          required: false
          description: Stat group. Omitted on the detailed view.
          schema:
            type: string
            enum:
              - summary
              - attack
              - defence
              - passing
              - goalkeeper
        - name: order
          in: query
          required: false
          description: "Statistic name. A leading minus sorts descending. Example: -rating."
          schema:
            type: string
          example: "-rating"
        - name: accumulation
          in: query
          required: false
          description: How each statistic is accumulated.
          schema:
            type: string
            enum:
              - total
              - perGame
              - per90
        - name: minApps
          in: query
          required: false
          description: Minimum-appearances option. Omit the parameter when it is off.
          schema:
            type: string
            enum:
              - yes
        - name: fields
          in: query
          required: false
          description: "Comma-separated statistic names for the detailed view. Example: goals,successfulDribbles,tackles,assists,accuratePassesPercentage,rating."
          schema:
            type: string
          example: "goals,successfulDribbles,tackles,assists,accuratePassesPercentage,rating"
        - name: filters
          in: query
          required: false
          description: "Comma-separated field.operator.value conditions. operator enum: GT, LT, EQ, in. field enum: position, type, appearances, age, preferredFoot, team, nationality. position enum: G, D, M, F. type enum: home, away. preferredFoot enum: Both, Right, Left. appearances and age take a number. team takes team ids. nationality takes country codes. Repeat values of one in condition with ~. Example: position.in.G~D~M~F,type.EQ.home."
          schema:
            type: string
          example: "position.in.G~D~M~F,type.EQ.home"
      responses:
        "200":
          description: A JSON object containing aggregated player statistics.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "404":
          description: Tournament or season with the specified ID not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "204":
          description: "No content. The requested route exists but there is no data available for the given parameters (e.g. match has no TV coverage, no statistics yet, empty search results, etc.)."
