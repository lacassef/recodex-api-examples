  "/api/motorsport/search/{term}":
    get:
      operationId: searchMotorsportEntities
      summary: Search motorsport entities
      description: Queries /search/all for this sport. The path term is sent as q. page is 0-based and defaults to 0.
      parameters:
        - name: term
          in: path
          required: true
          description: "Search term. Example: 'mercedes'."
          schema:
            type: string
          example: mercedes
        - name: page
          in: query
          required: false
          description: "Page number for pagination (defaults to 0). Example: 0."
          schema:
            type: integer
          example: 0
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "400":
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "204":
