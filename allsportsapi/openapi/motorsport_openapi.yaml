  /api/motorsport/categories/all:
    get:
      operationId: listEverySportCategory
      summary: List every sport category
      description: "Returns the full category list. Football is /api/tournament/categories/all. MMA is /api/mma/categories/all. Cycling is /api/cycling/categories/all. Motorsport is /api/motorsport/categories/all. Table tennis already had this path, so it is not registered again."
