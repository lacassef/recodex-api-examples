openapi: 3.0.0
info:
  title: SKAlpha API
  version: "1.0.0"
  description: SKAlpha API routes. OpenAPI specification.
  x-category: Finance
  x-long-description: SKAlpha API routes. OpenAPI specification. Status 204 means the route exists and there is no data for those parameters.
  x-version-lifecycle: active
servers:
  - url: https://skalpha1.p.rapidapi.com
    description: RapidAPI. Send this host in X-RapidAPI-Host.
paths:
  /api/skalpha/article-page-content-recommendations:
    get:
      operationId: articlePageContentRecommendations
      summary: Article page content recommendations
      description: Related content for an article page.
      parameters:
        - name: article_id
          in: query
          required: false
          description: Article ID
          schema:
            type: string
        - name: variation
          in: query
          required: false
          description: Variation key. The article page sends variation_a
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "204":
          description: "No content. The requested route exists but there is no data available for the given parameters (e.g. match has no TV coverage, no statistics yet, empty search results, etc.)."
  /api/skalpha/articles:
    get:
      operationId: articlesList
      summary: Articles list
      description: "Latest articles with optional filters (category, fields, include, pagination)."
