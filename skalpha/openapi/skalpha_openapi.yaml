  /api/skalpha/charts/lua:
    get:
      operationId: luaCharts
      summary: LUA charts
      description: Intraday and historical timeseries for a ticker_id. Accepts period or explicit from/to.
      parameters:
        - name: period
          in: query
          required: false
          description: "Chart window. The price buttons send 1D, 5D, 1M, 6M, YTD, 1Y, 5Y, 10Y, and MAX. 3Y is also accepted."
          schema:
            type: string
            enum:
              - "1D"
              - "5D"
              - "1M"
              - "6M"
              - "1Y"
              - "3Y"
              - "5Y"
              - "10Y"
              - YTD
              - MAX
        - name: from
          in: query
          required: false
          description: From date (YYYY-MM-DD)
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: To date (YYYY-MM-DD)
          schema:
            type: string
        - name: ticker_id
          in: query
          required: true
          description: Numeric SA ticker ID
          schema:
            type: integer
      responses:
