  "/api/skalpha/articles/{id}":
    get:
      operationId: articleByID
      summary: Article by ID
      description: Fetch a single article by ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Article ID
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: "Relationships to sideload. The article page sends author,primaryTickers,secondaryTickers,otherTags,presentations,presentations.slides,author.authorResearch,author.userBio"
          schema:
            type: string
        - name: lang
          in: query
          required: false
          description: Language code
          schema:
            type: string
        - name: sa_page_url
          in: query
          required: false
          description: "links.self path of this article, such as /article/4938289-headline-slug. Send the path, not an absolute URL"
          schema:
            type: string
        - name: sa_referrer
          in: query
          required: false
          description: "Path of the previous page, with no host, such as /filing/310003947. Omit it when there is no previous page"
          schema:
            type: string
        - name: sa_query
          in: query
          required: false
          description: Query string of the previous page. Omit it when there is none
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "500":
          description: Internal server error.
          content:
