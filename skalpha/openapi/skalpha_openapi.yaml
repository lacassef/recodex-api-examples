              - "sectors::consumer-staples"
              - "sectors::energy"
              - "sectors::real-estate"
              - stock-ideas
              - "stock-ideas::ai-tech-stocks"
              - "stock-ideas::basic-materials"
              - "stock-ideas::consumer-goods"
              - "stock-ideas::financial"
              - "stock-ideas::healthcare"
              - "stock-ideas::industrial-goods"
              - "stock-ideas::ipos"
              - "stock-ideas::long-ideas"
              - "stock-ideas::quick-picks"
              - "stock-ideas::technology"
              - "stock-ideas::utilities"
        - name: filter_since
          in: query
          required: false
          description: Since (epoch seconds)
          schema:
            type: integer
        - name: filter_until
          in: query
          required: false
          description: Until (epoch seconds)
          schema:
            type: integer
        - name: include
          in: query
          required: false
          description: "Includes (e.g., author,primaryTickers)"
          schema:
            type: string
        - name: page_size
          in: query
          required: false
          description: Page size (maximum 50)
          schema:
            type: integer
        - name: page_number
          in: query
          required: false
          description: Page number
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
