    get:
      operationId: getBanners
      summary: Get banners
      description: Returns banner placements.
      responses:
        "200":
          description: Banner payload.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JSONResult"
        "400":
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "502":
          description: The data could not be fetched.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "204":
          description: "No content. The requested route exists but there is no data available for the given parameters (e.g. match has no TV coverage, no statistics yet, empty search results, etc.)."
